name: Build APK from zip

on:
  push:
    paths:
      - 'terrario-android.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Extrair o projeto na raiz
        run: |
          unzip -o terrario-android.zip -d .
          ls -la

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceitar as licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar o APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: terrario-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
