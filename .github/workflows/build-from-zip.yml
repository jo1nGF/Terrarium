name: Build APK from zip

on:
  push:
    paths:
      - 'terrario-android.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Extrair o projeto na raiz
        run: |
          unzip -o terrario-android.zip -d .
          ls -la

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Licenças e plataforma do Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Compilar o APK (debug)
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Resumo do erro
        if: failure()
        run: |
          echo "=========== RESUMO DO ERRO (copie daqui) ==========="
          grep -n -B2 -A30 "What went wrong" build.log | head -90 || tail -90 build.log

      - name: Guardar o log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: terrario-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
